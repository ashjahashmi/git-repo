AWSTemplateFormatVersion: '2010-09-09'
Description: Creating ec2
Resources:
  MySecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Enable SSH
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 8080
          ToPort: 8080
          CidrIp: 0.0.0.0/0  

  MyEC2Instance:
    Type: AWS::EC2::Instance
    Properties:
      InstanceType: t3.micro
      ImageId: ami-004f790b835b26145
      KeyName: excersie
      SecurityGroups:
        - !Ref MySecurityGroup
      Tags:
        - Key: Name
          Value: updated code